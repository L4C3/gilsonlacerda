<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ORU Interactive Globe Presentation | Gilson Lacerda</title>
    <meta name="description" content="Interactive 3D globe presentation for ORU International Student Relations — by Gilson Lacerda.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <style>    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
        --gold:   #f4d35e;
        --gold2:  #ffe89a;
        --text:   #f8fafc;
        --muted:  rgba(248,250,252,.72);
        --dim:    rgba(248,250,252,.4);
        --border: rgba(255,255,255,.11);
        --glass:  rgba(4, 12, 36, 0.60);
    }

    html, body {
        width: 100%; height: 100%;
        overflow: hidden;
        font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
        color: var(--text);
        background: #03112e;
    }

    /* ══ BACKGROUND ════════════════════════════════ */
    #galaxy {
        position: fixed;
        inset: 0;
        z-index: 0;
        background:
                radial-gradient(ellipse 70% 80% at 50% 44%,
                #0c2050 0%,
                #071630 30%,
                #040e22 60%,
                #020a1a 100%
                );
    }
    #galaxy::after {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse 100% 100% at 50% 50%,
        transparent 40%,
        rgba(1,5,14,.55) 100%
        );
    }

    /* ══ PROGRESS BAR ══════════════════════════════ */
    #progress {
        position: fixed;
        top: 0; left: 0; right: 0;
        height: 2px;
        background: rgba(255,255,255,.05);
        z-index: 200;
    }
    #pb {
        height: 100%;
        background: linear-gradient(90deg, var(--gold), var(--gold2), #fff);
        transition: width .6s cubic-bezier(.4,0,.2,1);
        width: 14.28%;
    }

    /* ══ TOP HEADER ════════════════════════════════ */
    #top-header {
        position: fixed;
        top: 0; left: 0; right: 0;
        z-index: 50;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-top: 28px;
        gap: 12px;
        pointer-events: none;
    }
    .header-badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 7px 18px;
        border: 1px solid var(--border);
        background: rgba(6,16,44,.6);
        border-radius: 999px;
        font-size: 10px;
        letter-spacing: .28em;
        text-transform: uppercase;
        color: var(--muted);
        backdrop-filter: blur(16px);
    }
    .header-badge svg { color: var(--gold); }
    #page-title {
        font-size: clamp(1.6rem, 3vw, 2.8rem);
        font-weight: 900;
        letter-spacing: -.02em;
        text-align: center;
        line-height: 1;
    }
    #page-title span { color: var(--gold); }

    /* ══ GLOBE + ORBIT (fixed center) ═════════════ */
    #globe-scene {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width:  min(88vh, 88vw);
        height: min(88vh, 88vw);
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    #globe-scene::before {
        content: '';
        position: absolute;
        inset: -8%;
        border-radius: 50%;
        background: radial-gradient(circle,
        rgba(15, 45, 110, .45) 0%,
        rgba(8, 25, 65, .25)  45%,
        transparent 70%
        );
        pointer-events: none;
    }

    /* ══ GLOBE LOGO OVERLAY ════════════════════════ */
    #globe-logo {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 5;
        pointer-events: none;
        padding: 12px 20px;
        background: rgba(255, 255, 255, 0.92);
        border-radius: 12px;
        box-shadow: 0 8px 40px rgba(0,0,0,.5), 0 2px 8px rgba(0,0,0,.3);
    }
    #globe-logo img {
        display: block;
        width: clamp(140px, 20vw, 200px);
        height: auto;
    }

    /* globe sphere */
    #globe-wrap {
        position: relative;
        width: 82%;
        aspect-ratio: 1;
        border-radius: 50%;
        overflow: visible;
        animation: globe-float 6s ease-in-out infinite;
    }
    @keyframes globe-float {
        0%,100% { transform: translateY(0px); }
        50%      { transform: translateY(-14px); }
    }
    #globe-clip {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        overflow: hidden;
        border: 1px solid rgba(255,255,255,.08);
        box-shadow: 0 0 0 1px rgba(100,160,255,.12);
    }
    #globe-canvas { width: 100% !important; height: 100% !important; display: block; }
    .globe-sheen {
        position: absolute; inset: 0;
        border-radius: 50%;
        background:
                radial-gradient(circle at 32% 25%, rgba(255,255,255,.22), transparent 16%),
                radial-gradient(circle at 68% 75%, rgba(20,60,160,.12), transparent 22%);
        mix-blend-mode: screen;
        pointer-events: none;
    }
    #globe-atm {
        position: absolute;
        inset: -4.5%;
        border-radius: 50%;
        background: transparent;
        box-shadow:
                0 0 0 4px  rgba(60, 120, 255, .10),
                0 0 20px 8px rgba(40, 90, 220, .14),
                0 0 50px 18px rgba(20, 60, 180, .10),
                0 0 90px 32px rgba(10, 40, 130, .07);
        pointer-events: none;
    }

    /* ══ SLIDE CARD (compact, clickable) ══════════ */
    #slide-stage {
        position: fixed;
        bottom: 80px;
        left: 50%;
        transform: translateX(-50%);
        width: min(92%, 720px);
        z-index: 30;
        pointer-events: none;
    }
    #slide-panel {
        pointer-events: all;
        background: var(--glass);
        backdrop-filter: blur(28px) saturate(1.5);
        -webkit-backdrop-filter: blur(28px) saturate(1.5);
        border: 1px solid rgba(255,255,255,.12);
        border-top: 1px solid rgba(255,255,255,.18);
        border-radius: 22px;
        padding: 22px 26px 18px;
        box-shadow:
                0 12px 50px rgba(0,0,0,.55),
                0 2px 0 rgba(255,255,255,.04) inset;
        cursor: pointer;
        transition: border-color .2s, box-shadow .2s;
    }
    #slide-panel:hover {
        border-color: rgba(244,211,94,.28);
        box-shadow:
                0 16px 60px rgba(0,0,0,.6),
                0 0 0 1px rgba(244,211,94,.12),
                0 2px 0 rgba(255,255,255,.04) inset;
    }

    @keyframes enterRight {
        from { transform: translateX(72px); opacity: 0; filter: blur(3px); }
        to   { transform: translateX(0);    opacity: 1; filter: blur(0);   }
    }
    @keyframes exitLeft {
        from { transform: translateX(0);     opacity: 1; filter: blur(0);   }
        to   { transform: translateX(-72px); opacity: 0; filter: blur(3px); }
    }
    .panel-enter { animation: enterRight .48s cubic-bezier(.22,1,.36,1) both; }
    .panel-exit  { animation: exitLeft   .32s cubic-bezier(.4,0,1,1)    both; }

    /* compact card layout */
    .card-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 10px;
    }
    .s-eyebrow {
        font-size: 10px;
        letter-spacing: .28em;
        text-transform: uppercase;
        color: rgba(244,211,94,.85);
        margin-bottom: 6px;
    }
    .s-title {
        font-size: clamp(1.2rem, 2.2vw, 1.75rem);
        font-weight: 900;
        line-height: 1.05;
        letter-spacing: -.02em;
    }
    .s-subtitle {
        font-size: clamp(.8rem, 1.1vw, .95rem);
        color: rgba(244,211,94,.75);
        margin-top: 4px;
        line-height: 1.4;
    }
    .card-tap-hint {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 6px 12px;
        border: 1px solid var(--border);
        background: rgba(255,255,255,.05);
        border-radius: 999px;
        font-size: 11px;
        color: var(--dim);
        white-space: nowrap;
    }
    .card-tap-hint svg { width: 11px; height: 11px; }
    .card-points {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 10px;
    }
    .point-chip {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 5px 11px;
        background: rgba(244,211,94,.08);
        border: 1px solid rgba(244,211,94,.18);
        border-radius: 999px;
        font-size: 11px;
        color: rgba(255,255,255,.78);
    }
    .point-chip svg { width: 10px; height: 10px; color: var(--gold); flex-shrink: 0; }

    /* ══ BOTTOM NAV ════════════════════════════════ */
    #bottom-nav {
        position: fixed;
        bottom: 0; left: 0; right: 0;
        height: 72px;
        z-index: 40;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: linear-gradient(to top, rgba(2,8,22,.85) 0%, transparent 100%);
        backdrop-filter: blur(4px);
    }
    .nav-arrow {
        width: 40px; height: 40px;
        border-radius: 50%;
        border: 1px solid var(--border);
        background: rgba(6,16,44,.7);
        color: var(--text);
        display: flex; align-items: center; justify-content: center;
        cursor: pointer;
        transition: background .2s, border-color .2s, transform .15s;
        backdrop-filter: blur(10px);
    }
    .nav-arrow:hover:not(:disabled) {
        background: rgba(244,211,94,.15);
        border-color: rgba(244,211,94,.4);
        transform: scale(1.08);
    }
    .nav-arrow:disabled { opacity: .28; cursor: not-allowed; }
    .nav-arrow svg { width: 18px; height: 18px; }
    #nav-dots { display: flex; align-items: center; gap: 9px; }
    .nav-dot {
        width: 7px; height: 7px;
        border-radius: 50%;
        background: rgba(255,255,255,.25);
        border: 1px solid transparent;
        cursor: pointer;
        transition: all .3s;
    }
    .nav-dot.active {
        background: var(--gold);
        width: 22px;
        border-radius: 999px;
        box-shadow: 0 0 10px rgba(244,211,94,.5);
    }
    .nav-dot:hover:not(.active) { background: rgba(255,255,255,.5); }
    #nav-labels { display: none; gap: 8px; }
    @media (min-width: 900px) { #nav-labels { display: flex; } }
    .nav-label {
        padding: 6px 14px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        border: 1px solid var(--border);
        background: rgba(6,16,44,.6);
        color: rgba(255,255,255,.6);
        backdrop-filter: blur(10px);
        transition: all .2s;
    }
    .nav-label.active {
        background: rgba(244,211,94,.15);
        border-color: rgba(244,211,94,.4);
        color: var(--gold);
    }
    .nav-label:hover:not(.active) { background: rgba(255,255,255,.08); color: #fff; }

    /* ══ DETAIL OVERLAY (full scrollable page) ═════ */
    #detail-overlay {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 300;
        background: rgba(2, 8, 20, 0.96);
        backdrop-filter: blur(24px);
        overflow-y: auto;
        overflow-x: hidden;
    }
    #detail-overlay.open { display: block; }

    .detail-close-bar {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        justify-content: flex-end;
        padding: 16px 20px;
        background: linear-gradient(
                rgba(2,8,20,.98) 0%,
                rgba(2,8,20,.8) 70%,
                transparent 100%
        );
    }
    .detail-close-btn {
        width: 40px; height: 40px;
        border-radius: 50%;
        border: 1px solid var(--border);
        background: rgba(255,255,255,.08);
        color: rgba(255,255,255,.75);
        cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        transition: background .2s, color .2s;
        flex-shrink: 0;
    }
    .detail-close-btn:hover { background: rgba(255,255,255,.16); color: #fff; }
    .detail-close-btn svg { width: 16px; height: 16px; }

    .detail-inner {
        max-width: 760px;
        margin: 0 auto;
        padding: 0 24px 80px;
    }

    .detail-img-wrap {
        width: 100%;
        border-radius: 20px;
        overflow: hidden;
        margin-bottom: 36px;
        background: rgba(255,255,255,.03);
        border: 1px solid var(--border);
    }
    .detail-img-wrap img {
        width: 100%;
        height: auto;
        display: block;
    }
    .detail-img-placeholder {
        width: 100%;
        aspect-ratio: 16/9;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--dim);
    }
    .detail-img-placeholder svg { width: 36px; height: 36px; opacity: .3; }

    .d-eyebrow {
        font-size: 10px;
        letter-spacing: .3em;
        text-transform: uppercase;
        color: rgba(244,211,94,.8);
        margin-bottom: 10px;
    }
    .d-title {
        font-size: clamp(2rem, 4vw, 3.2rem);
        font-weight: 900;
        letter-spacing: -.025em;
        line-height: 1;
        margin-bottom: 14px;
    }
    .d-subtitle {
        font-size: clamp(.95rem, 1.5vw, 1.2rem);
        color: rgba(244,211,94,.82);
        line-height: 1.5;
        margin-bottom: 24px;
        padding-bottom: 24px;
        border-bottom: 1px solid var(--border);
    }
    .d-body {
        font-size: clamp(.9rem, 1.3vw, 1.05rem);
        line-height: 1.85;
        color: var(--muted);
        margin-bottom: 28px;
    }
    .d-points {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 32px;
    }
    .d-chip {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 9px 16px;
        background: rgba(244,211,94,.1);
        border: 1px solid rgba(244,211,94,.22);
        border-radius: 999px;
        font-size: 13px;
        color: rgba(255,255,255,.85);
    }
    .d-chip svg { width: 12px; height: 12px; color: var(--gold); flex-shrink: 0; }
    .d-quote {
        font-style: italic;
        font-size: clamp(1rem, 1.4vw, 1.15rem);
        line-height: 1.8;
        color: rgba(255,255,255,.88);
        border-left: 3px solid var(--gold);
        padding: 4px 0 4px 20px;
        margin-top: 8px;
    }
    .detail-nav-row {
        display: flex;
        gap: 12px;
        margin-top: 48px;
        padding-top: 24px;
        border-top: 1px solid var(--border);
    }
    .d-nav-btn {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 14px 20px;
        border: 1px solid var(--border);
        background: rgba(255,255,255,.05);
        border-radius: 14px;
        font-size: 13px;
        font-weight: 600;
        color: var(--muted);
        cursor: pointer;
        transition: background .2s, color .2s, border-color .2s;
    }
    .d-nav-btn:hover:not(:disabled) {
        background: rgba(244,211,94,.12);
        border-color: rgba(244,211,94,.3);
        color: var(--gold);
    }
    .d-nav-btn:disabled { opacity: .25; cursor: not-allowed; }
    .d-nav-btn svg { width: 16px; height: 16px; }
    </style>
</head>

<body>

<!-- BACKGROUND -->
<div id="galaxy"></div>

<!-- PROGRESS -->
<div id="progress"><div id="pb"></div></div>

<!-- TOP HEADER -->
<header id="top-header">
    <div class="header-badge">
        <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <line x1="2" y1="12" x2="22" y2="12"/>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
        </svg>International Student Onboarding:  </div>
    <div id="page-title">Let the <span>globe lead</span> the presentation.</div>
</header>

<!-- GLOBE SCENE -->
<div id="globe-scene">
    <div id="globe-logo">
        <img src="assets/img/oru-logo.webp" alt="Oral Roberts University">
    </div>  <div id="globe-wrap">
    <div id="globe-atm"></div>
    <div id="globe-clip">
        <canvas id="globe-canvas" width="800" height="800"></canvas>
        <div class="globe-sheen"></div>
    </div>  </div></div>

<!-- SLIDE CARD (compact, click to expand) -->
<div id="slide-stage">
    <div id="slide-panel" onclick="openDetail()">
        <div class="card-top">
            <div>        <div class="s-eyebrow" id="s-eyebrow"></div>
                <div class="s-title"   id="s-title"></div>
                <div class="s-subtitle" id="s-subtitle"></div>
            </div>      <div class="card-tap-hint">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>
            </svg>        Expand
        </div>
        </div>    <div class="card-points" id="s-points"></div>
    </div></div>

<!-- BOTTOM NAV -->
<nav id="bottom-nav">
    <button class="nav-arrow" id="btn-prev" onclick="navigate(-1)" disabled>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5"/><path d="m12 5-7 7 7 7"/>
        </svg>  </button>  <div id="nav-dots"></div>
    <div id="nav-labels"></div>
    <button class="nav-arrow" id="btn-next" onclick="navigate(1)">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>
        </svg>  </button></nav>

<!-- DETAIL OVERLAY (full scrollable page) -->
<div id="detail-overlay" onclick="if(event.target===this)closeDetail()">
    <div class="detail-close-bar">
        <button class="detail-close-btn" onclick="closeDetail()">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
            </svg>    </button>  </div>  <div class="detail-inner">
    <div class="detail-img-wrap" id="d-img-wrap"></div>
    <div class="d-eyebrow" id="d-eyebrow"></div>
    <h2 class="d-title"    id="d-title"></h2>
    <div class="d-subtitle" id="d-subtitle"></div>
    <p class="d-body"      id="d-body"></p>
    <div class="d-points"  id="d-points"></div>
    <blockquote class="d-quote" id="d-quote" style="display:none"></blockquote>
    <div class="detail-nav-row">
        <button class="d-nav-btn" id="d-prev" onclick="detailNavigate(-1)">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 12H5"/><path d="m12 5-7 7 7 7"/>
            </svg>        Previous
        </button>
        <button class="d-nav-btn" id="d-next" onclick="detailNavigate(1)">
            Next
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>
            </svg>      </button>    </div>  </div></div>

<!-- THREE.JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
    /* ═══════════════════════════════════════════════════
       SLIDES DATA   Angles spread from top (-65°) to bottom (65°)   on the vertical orbit ellipse══════════════════════════════════════════════════ */
    const SLIDES = [
        {
            id: 'intro', label: 'Intro',
            eyebrow: 'Presentation Overview',
            title: 'International Student Onboarding',
            subtitle: 'Structure, Care, and Purpose',
            body: 'A cinematic introduction built around a high-impact globe visual. The orbit becomes the navigation system — the presentation feels like a guided journey, not a static slide deck. Every transition, every interaction is designed to create a sense of wonder and clarity from the very first moment.',
            points: ['Immersive first impression', 'Premium visual language', 'Clear narrative flow'],
            image: 'assets/img/slides/slide-1.jpg',
            angle: -65, globeX: -0.08,
        },
        {
            id: 'gilson', label: 'About',
            eyebrow: 'About Me',
            title: "I'm Gilson Lacerda",
            subtitle: 'Systems thinker with global perspective',
            body: "My background spans software engineering, multilingual communication, and faith-centered leadership. I've lived the international student experience firsthand — arriving in a new country, navigating cultural transitions, and finding community within a faith-based institution. That combination of technical and human skills is purpose-built for serving international students at ORU.",
            points: ['Software Engineering', 'Leadership background', 'Multilingual communication', 'Faith-centered perspective'],
            image: 'assets/img/slides/slide-2.jpg',
            angle: -43, globeX: -0.05,
        },
        {
            id: 'oru', label: 'Why ORU',
            eyebrow: 'Mission Alignment',
            title: 'Why ORU?',
            subtitle: 'Mission, excellence, and global impact',
            body: "ORU sits at the intersection of academic rigor and spiritual formation. That combination is exactly what drew me here — not just a job, but a calling that aligns with my deepest convictions. The university's commitment to developing the whole person — spirit, mind, and body — reflects the values I carry into every system I build and every person I serve.",
            points: ['Mission-driven service', 'Academic excellence', 'Global impact', 'Whole-person development'],
            image: 'assets/img/slides/slide-3.jpg',
            angle: -22, globeX: -0.02,
        },
        {
            id: 'isr', label: 'Role Fit',
            eyebrow: 'Calling & Fit',
            title: 'Why International Student Relations',
            subtitle: 'Communication, structure, and care',

    /* ═══════════════════════════════════════════════════
       THREE.JS GLOBE══════════════════════════════════════════════════ */
    let globeMesh, cloudMesh, targetTiltX = 0;

    function initGlobe() {
        const canvas = document.getElementById('globe-canvas');
        const sz     = canvas.offsetWidth || 600;

        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(sz, sz);
        renderer.setClearColor(0x000000, 0);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.1;

        const scene  = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
        camera.position.z = 2.55;

        scene.add(new THREE.AmbientLight(0x0d1830, 0.4));

        const sun = new THREE.DirectionalLight(0xfff6e8, 2.0);
        sun.position.set(3.5, 1.8, 3.5);
        scene.add(sun);

        const fill = new THREE.DirectionalLight(0x1a3a6a, 0.18);
        fill.position.set(-4, -1, -3);
        scene.add(fill);

        const loader = new THREE.TextureLoader();
        const earthTex  = loader.load('https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg');
        const normalTex = loader.load('https://threejs.org/examples/textures/planets/earth_normal_2048.jpg');
        const specTex   = loader.load('https://threejs.org/examples/textures/planets/earth_specular_2048.jpg');
        const cloudTex  = loader.load('https://threejs.org/examples/textures/planets/earth_clouds_1024.png');

        globeMesh = new THREE.Mesh(
            new THREE.SphereGeometry(1, 80, 80),
            new THREE.MeshPhongMaterial({
                map:         earthTex,
                normalMap:   normalTex,
                specularMap: specTex,
                specular:    new THREE.Color(0x4488cc),
                shininess:   45,
            })
        );
        globeMesh.rotation.y = -0.48;
        scene.add(globeMesh);

        scene.add(new THREE.Mesh(
            new THREE.SphereGeometry(1.06, 64, 64),
            new THREE.MeshPhongMaterial({
                color: 0x1a4a99, emissive: new THREE.Color(0x0a2060),
                transparent: true, opacity: 0.18,
                side: THREE.BackSide, depthWrite: false,
            })
        ));
        scene.add(new THREE.Mesh(
            new THREE.SphereGeometry(1.15, 64, 64),
            new THREE.MeshPhongMaterial({
                color: 0x0d2a66, emissive: new THREE.Color(0x061540),
                transparent: true, opacity: 0.08,
                side: THREE.BackSide, depthWrite: false,
            })
        ));

        cloudMesh = new THREE.Mesh(
            new THREE.SphereGeometry(1.015, 64, 64),
            new THREE.MeshPhongMaterial({
                map: cloudTex, transparent: true, opacity: 0.42, depthWrite: false,
            })
        );
        cloudMesh.rotation.y = -0.48;
        scene.add(cloudMesh);

        (function tick() {
            requestAnimationFrame(tick);
            globeMesh.rotation.y  += 0.0007;
            cloudMesh.rotation.y  += 0.0009;
            globeMesh.rotation.x  += (targetTiltX - globeMesh.rotation.x) * 0.045;
            cloudMesh.rotation.x   = globeMesh.rotation.x;
            renderer.render(scene, camera);
        })();

        new ResizeObserver(() => {
            const s = canvas.offsetWidth;
            renderer.setSize(s, s);
        }).observe(canvas);
    }

    /* ═══════════════════════════════════════════════════
       ORBIT DOTS — vertical ellipse positioning   angle is the parametric angle on the ellipse:   -65° = near top, 0° = right equator, 65° = near bottom══════════════════════════════════════════════════ */
    /* ═══════════════════════════════════════════════════
       BOTTOM NAV══════════════════════════════════════════════════ */
    function buildBottomNav() {
        const dots   = document.getElementById('nav-dots');
        const labels = document.getElementById('nav-labels');
        dots.innerHTML = labels.innerHTML = '';
        SLIDES.forEach((s, i) => {
            const d = document.createElement('div');
            d.className   = 'nav-dot' + (i === 0 ? ' active' : '');
            d.dataset.idx = i;
            d.onclick     = () => jumpTo(i);
            dots.appendChild(d);

            const l = document.createElement('button');
            l.className   = 'nav-label' + (i === 0 ? ' active' : '');
            l.dataset.idx = i;
            l.textContent = s.label;
            l.onclick     = () => jumpTo(i);
            labels.appendChild(l);
        });
    }

    /* ═══════════════════════════════════════════════════
       RENDER SLIDE (compact card)══════════════════════════════════════════════════ */
    let animating = false;

    function renderSlide(idx) {
        const s     = SLIDES[idx];
        const panel = document.getElementById('slide-panel');

        document.getElementById('pb').style.width = ((idx + 1) / SLIDES.length * 100) + '%';

        document.querySelectorAll('.nav-dot').forEach((d, i)   => d.classList.toggle('active', i === idx));
        document.querySelectorAll('.nav-label').forEach((l, i) => l.classList.toggle('active', i === idx));
        document.getElementById('btn-prev').disabled = idx === 0;
        document.getElementById('btn-next').disabled = idx === SLIDES.length - 1;

        targetTiltX = s.globeX;

        if (animating) { fillCard(s); return; }
        animating = true;

        panel.classList.remove('panel-enter');
        panel.classList.add('panel-exit');
        setTimeout(() => {
            fillCard(s);
            panel.classList.remove('panel-exit');
            panel.classList.add('panel-enter');
            setTimeout(() => { panel.classList.remove('panel-enter'); animating = false; }, 500);
        }, 300);
    }

    function fillCard(s) {
        document.getElementById('s-eyebrow').textContent  = s.eyebrow;
        document.getElementById('s-title').textContent    = s.title;
        document.getElementById('s-subtitle').textContent = s.subtitle;

        const pts = document.getElementById('s-points');
        pts.innerHTML = s.points
            ? s.points.slice(0, 4).map(p => `
        <span class="point-chip">          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"               stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">            <path d="m9 18 6-6-6-6"/>          </svg>${p}
        </span>`).join('')
            : '';
    }

    /* ═══════════════════════════════════════════════════
       DETAIL OVERLAY — full scrollable view══════════════════════════════════════════════════ */
    function openDetail() {
        const s = SLIDES[activeIndex];
        const overlay = document.getElementById('detail-overlay');

        /* populate */
        document.getElementById('d-eyebrow').textContent  = s.eyebrow;
        document.getElementById('d-title').textContent    = s.title;
        document.getElementById('d-subtitle').textContent = s.subtitle;
        document.getElementById('d-body').textContent     = s.body;

        /* points */
        const pts = document.getElementById('d-points');
        pts.innerHTML = s.points
            ? s.points.map(p => `
        <span class="d-chip">          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"               stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">            <path d="m9 18 6-6-6-6"/>          </svg>${p}
        </span>`).join('')
            : '';

        /* quote */
        const q = document.getElementById('d-quote');
        if (s.quote) { q.style.display = 'block'; q.textContent = `"${s.quote}"`; }
        else          { q.style.display = 'none'; }

        /* image */
        const imgWrap = document.getElementById('d-img-wrap');
        if (s.image) {
            const img = new Image();
            img.alt = s.title;
            img.onload  = () => { imgWrap.innerHTML = ''; imgWrap.appendChild(img); imgWrap.style.display = ''; };
            img.onerror = () => { imgWrap.style.display = 'none'; };
            imgWrap.style.display = '';
            img.src = s.image;
        } else {
            imgWrap.style.display = 'none';
        }

        /* nav buttons */
        document.getElementById('d-prev').disabled = activeIndex === 0;
        document.getElementById('d-next').disabled = activeIndex === SLIDES.length - 1;

        overlay.scrollTop = 0;
        overlay.classList.add('open');
        document.body.style.overflow = 'hidden';
    }

    function closeDetail() {
        document.getElementById('detail-overlay').classList.remove('open');
        document.body.style.overflow = '';
    }

    function detailNavigate(dir) {
        const next = Math.max(0, Math.min(SLIDES.length - 1, activeIndex + dir));
        if (next !== activeIndex) {
            jumpTo(next);
            openDetail();
        }
    }

    /* ═══════════════════════════════════════════════════
       NAVIGATION══════════════════════════════════════════════════ */
    let activeIndex = 0;
    let timer       = null;

    function jumpTo(i) {
        activeIndex = i;
        renderSlide(i);
        resetTimer();
    }

    function navigate(dir) {
        const next = Math.max(0, Math.min(SLIDES.length - 1, activeIndex + dir));
        if (next !== activeIndex) jumpTo(next);
    }

    function resetTimer() {
        clearInterval(timer);
        timer = setInterval(() => {
            activeIndex = (activeIndex + 1) % SLIDES.length;
            renderSlide(activeIndex);
        }, 7000);
    }

    /* ═══════════════════════════════════════════════════
       KEYBOARD══════════════════════════════════════════════════ */
    document.addEventListener('keydown', e => {
        const detailOpen = document.getElementById('detail-overlay').classList.contains('open');
        if (e.key === 'Escape') { if (detailOpen) closeDetail(); return; }
        if (detailOpen) return; /* don't change slides while detail is open */
        if (e.key === 'ArrowRight' || e.key === 'ArrowDown') navigate(1);
        if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   navigate(-1);
        if (e.key === 'Enter' || e.key === ' ') openDetail();
    });

    /* ═══════════════════════════════════════════════════
       INIT══════════════════════════════════════════════════ */
    window.addEventListener('DOMContentLoaded', () => {
        buildBottomNav();
        initGlobe();

        const s     = SLIDES[0];
        const panel = document.getElementById('slide-panel');
        fillCard(s);
        panel.classList.add('panel-enter');
        setTimeout(() => panel.classList.remove('panel-enter'), 500);

        document.getElementById('btn-prev').disabled = true;
        document.getElementById('pb').style.width    = (1 / SLIDES.length * 100) + '%';
        targetTiltX = s.globeX;
        resetTimer();
    });
</script>
