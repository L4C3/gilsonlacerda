<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ORU Interactive Globe Presentation | Gilson Lacerda</title>
    <meta name="description" content="Interactive 3D globe presentation for ORU International Student Relations — by Gilson Lacerda.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Great+Vibes&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --gold:   #f4d35e;
            --gold2:  #ffe89a;
            --text:   #f8fafc;
            --muted:  rgba(248,250,252,.72);
            --dim:    rgba(248,250,252,.4);
            --border: rgba(255,255,255,.11);
            --glass:  rgba(4, 12, 36, 0.60);
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
            color: var(--text);
            background: #03112e;
        }

        #galaxy {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                    radial-gradient(ellipse 70% 80% at 50% 44%,
                    #0c2050 0%, #071630 30%, #040e22 60%, #020a1a 100%);
        }

        #galaxy::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse 100% 100% at 50% 50%,
            transparent 40%, rgba(1,5,14,.55) 100%);
        }

        /* ══ GLOBE SCENE ══════════════════════════════ */
        #globe-scene {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: min(88vh, 88vw);
            height: min(88vh, 88vw);
        }

        #globe-scene::before {
            content: '';
            position: absolute;
            inset: -8%;
            border-radius: 50%;
            background: radial-gradient(circle,
            rgba(15,45,110,.45) 0%, rgba(8,25,65,.25) 45%, transparent 70%);
            pointer-events: none;
            z-index: 1;
        }

        #globe-wrap {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 82%;
            aspect-ratio: 1;
            border-radius: 50%;
            overflow: visible;
            animation: globe-float 6s ease-in-out infinite;
            z-index: 10;
        }

        @keyframes globe-float {
            0%, 100% { transform: translate(-50%, -50%) translateY(0px); }
            50%       { transform: translate(-50%, -50%) translateY(-14px); }
        }

        #globe-clip {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,.08);
            box-shadow: 0 0 0 1px rgba(100,160,255,.12);
        }

        #globe-canvas { width: 100% !important; height: 100% !important; display: block; }

        .globe-sheen {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background:
                    radial-gradient(circle at 24% 20%, rgba(255,255,255,.07), transparent 22%),
                    radial-gradient(circle at 68% 75%, rgba(20,60,160,.08), transparent 25%);
            mix-blend-mode: screen;
            pointer-events: none;
        }

        #globe-atm {
            position: absolute;
            inset: -4.5%;
            border-radius: 50%;
            background: transparent;
            box-shadow:
                    0 0 0 4px rgba(255,210,60,.10),
                    0 0 20px 8px rgba(214,166,58,.14),
                    0 0 50px 18px rgba(180,124,20,.10),
                    0 0 90px 32px rgba(130,110,10,.07);
            pointer-events: none;
        }

        #globe-logo {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
            pointer-events: none;
        }

        #globe-logo img {
            display: block;
            width: clamp(220px, 30vw, 400px);
            height: auto;
            filter:
                    drop-shadow(0 0 12px rgba(255,205,80,.6))
                    drop-shadow(0 0 28px rgba(80,140,255,.4))
                    drop-shadow(0 10px 28px rgba(0,0,0,.35));
        }

        /* ══ ORBIT NAV ════════════════════════════════ */
        #orbit-nav {
            position: absolute;
            inset: -10%;
            z-index: 30;
            pointer-events: none;
        }

        #orbit-ring { position: absolute; inset: 0; pointer-events: none; }

        #orbit-belt {
            position: absolute;
            left: 8%; right: 8%; top: 50%;
            height: 34%;
            transform: translateY(-50%);
            border: 1px solid rgba(80,130,255,.08);
            border-radius: 50%;
            pointer-events: none;
            opacity: .45;
            filter: blur(.2px);
        }

        #orbit-planets { position: absolute; inset: 0; pointer-events: none; }

        .orbit-planet {
            position: absolute;
            width: 64px; height: 64px;
            margin-left: -32px; margin-top: -32px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,.14);
            background: radial-gradient(circle at 32% 28%,
            rgba(255,255,255,.18) 0%, rgba(30,60,140,.14) 24%, rgba(5,16,46,.94) 72%);
            box-shadow: 0 10px 26px rgba(0,0,0,.35), inset 0 1px 4px rgba(255,255,255,.08);
            display: flex; align-items: center; justify-content: center;
            color: rgba(255,255,255,.84);
            font-size: 9px; font-weight: 800;
            text-transform: uppercase; letter-spacing: .08em;
            text-align: center; line-height: 1.05;
            cursor: pointer; pointer-events: auto;
            transition: border-color .22s, box-shadow .22s, opacity .22s, background .22s;
            padding: 8px;
        }

        .orbit-planet:hover {
            border-color: rgba(244,211,94,.42);
            box-shadow: 0 14px 30px rgba(0,0,0,.42), 0 0 18px rgba(244,211,94,.12),
            inset 0 1px 4px rgba(255,255,255,.12);
        }

        .orbit-planet.active {
            border-color: rgba(244,211,94,.75);
            color: var(--gold);
            background: radial-gradient(circle at 32% 28%,
            rgba(255,232,154,.34) 0%, rgba(244,211,94,.14) 26%, rgba(12,20,52,.96) 74%);
            box-shadow: 0 14px 32px rgba(0,0,0,.48), 0 0 22px rgba(244,211,94,.18),
            inset 0 1px 4px rgba(255,255,255,.14);
        }

        .orbit-planet span { display: block; max-width: 48px; }

        .orbit-arrow {
            position: absolute;
            top: 85%;
            width: 44px; height: 44px;
            margin-top: -22px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: rgba(6,16,44,.62);
            color: var(--text);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; pointer-events: auto;
            z-index: 40;
            transition: all .2s ease;
            backdrop-filter: blur(8px);
        }

        .orbit-arrow:hover:not(:disabled) {
            background: rgba(244,211,94,.15);
            border-color: rgba(244,211,94,.34);
            transform: translateY(-50%) scale(1.08);
        }

        .orbit-arrow:disabled { opacity: .25; cursor: not-allowed; }
        #orbit-prev { left: 8%; }
        #orbit-next { right: 8%; }
        .orbit-arrow svg { width: 18px; height: 18px; }

        /* ══ TITLE BANNER ═════════════════════════════ */
        #title-banner {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            z-index: 30;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 40px 22px;
            background: linear-gradient(to top,
            rgba(2,8,24,.92) 0%, rgba(3,12,36,.78) 60%, transparent 100%);
            backdrop-filter: blur(2px);
            pointer-events: none;
        }

        .banner-left { display: flex; flex-direction: column; gap: 4px; }

        .banner-title {
            font-size: clamp(1.1rem, 2.2vw, 1.6rem);
            font-weight: 900; letter-spacing: -.02em; line-height: 1.05; color: #fff;
        }

        .banner-subtitle {
            font-size: clamp(.8rem, 1.1vw, 1rem);
            color: rgba(248,250,252,.55); font-weight: 400; letter-spacing: .01em;
        }

        .banner-byline { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

        .banner-by {
            font-size: clamp(.75rem, 1vw, .9rem);
            color: rgba(248,250,252,.45); font-weight: 400;
        }

        .banner-name {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(1.4rem, 2.4vw, 2rem);
            color: var(--gold); line-height: 1;
            filter: drop-shadow(0 2px 8px rgba(244,211,94,.25));
        }

        /* ══ DETAIL OVERLAY ═══════════════════════════ */
        #detail-overlay {
            display: none;
            position: fixed; inset: 0;
            z-index: 300;
            background: rgba(2,8,20,.97);
            backdrop-filter: blur(24px);
            opacity: 0;
            transition: opacity .28s ease;
            flex-direction: column;
        }

        #detail-overlay.open { display: flex; opacity: 1; }

        .detail-close-bar {
            flex-shrink: 0;
            display: grid;
            grid-template-columns: 40px 1fr 40px;
            align-items: center;
            padding: 14px 20px;
            border-bottom: 1px solid var(--border);
            gap: 12px;
        }

        .detail-slide-menu {
            display: flex; align-items: center; justify-content: center;
            gap: 6px; flex-wrap: wrap;
        }

        .slide-menu-btn {
            padding: 5px 14px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: rgba(255,255,255,.05);
            color: rgba(255,255,255,.5);
            font-size: 11px; font-weight: 700;
            text-transform: uppercase; letter-spacing: .08em;
            cursor: pointer;
            transition: background .2s, border-color .2s, color .2s;
            white-space: nowrap;
        }

        .slide-menu-btn:hover {
            background: rgba(244,211,94,.1);
            border-color: rgba(244,211,94,.3);
            color: rgba(255,255,255,.85);
        }

        .slide-menu-btn.active {
            background: rgba(244,211,94,.15);
            border-color: rgba(244,211,94,.6);
            color: var(--gold);
        }

        .detail-close-btn {
            width: 36px; height: 36px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: rgba(255,255,255,.07);
            color: rgba(255,255,255,.7);
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: background .2s, color .2s;
            justify-self: end;
        }

        .detail-close-btn:hover { background: rgba(255,255,255,.15); color: #fff; }
        .detail-close-btn svg { width: 14px; height: 14px; }

        .detail-scroll { flex: 1; overflow-y: auto; overflow-x: hidden; }

        /* ── Text + points section ── */
        .detail-content {
            display: grid;
            grid-template-columns: 1fr 220px;
            gap: 0;
            padding: 32px 40px 24px;
            border-bottom: 1px solid var(--border);
            max-width: 960px;
            margin: 0 auto;
            width: 100%;
        }

        .detail-text { padding-right: 40px; }

        .d-title {
            font-size: clamp(1.8rem, 3.2vw, 2.8rem);
            font-weight: 900; letter-spacing: -.025em; line-height: 1.05;
            margin-bottom: 8px;
        }

        .d-subtitle {
            font-size: clamp(.9rem, 1.3vw, 1.1rem);
            color: rgba(244,211,94,.78); line-height: 1.5; margin-bottom: 16px;
        }

        .d-body {
            font-size: clamp(.85rem, 1.1vw, .98rem);
            line-height: 1.85; color: var(--muted);
        }

        .d-quote {
            font-style: italic;
            font-size: clamp(.9rem, 1.2vw, 1.05rem);
            line-height: 1.8; color: rgba(255,255,255,.85);
            border-left: 3px solid var(--gold);
            padding: 4px 0 4px 18px; margin-top: 18px;
        }

        /* ── Right key points — plain list, NOT buttons ── */
        .detail-chips {
            border-left: 1px solid var(--border);
            padding-left: 28px;
            display: flex; flex-direction: column; gap: 0;
        }

        .chips-label {
            font-size: 10px; letter-spacing: .28em; text-transform: uppercase;
            color: rgba(244,211,94,.6); margin-bottom: 14px;
        }

        /* Plain list item — no border, no hover, no button look */
        .d-point {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 7px 0;
            border-bottom: 0.5px solid rgba(255,255,255,.06);
            font-size: 13px;
            color: rgba(255,255,255,.78);
            line-height: 1.4;
        }

        .d-point:last-child { border-bottom: none; }

        .d-point-dot {
            width: 5px; height: 5px;
            border-radius: 50%;
            background: var(--gold);
            flex-shrink: 0;
            margin-top: 5px;
            opacity: .7;
        }

        /* ── Gallery ── */
        .detail-gallery {
            padding: 24px 0 16px;
            max-width: 960px; margin: 0 auto; width: 100%;
        }

        .gallery-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 40px 14px;
        }

        .gallery-label {
            font-size: 10px; letter-spacing: .28em; text-transform: uppercase;
            color: rgba(244,211,94,.6);
        }

        .gallery-controls { display: flex; align-items: center; gap: 8px; }

        .car-btn {
            width: 34px; height: 34px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: rgba(255,255,255,.06);
            color: rgba(255,255,255,.7);
            font-size: 18px; line-height: 1;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: background .2s, border-color .2s, color .2s;
        }

        .car-btn:hover:not(:disabled) {
            background: rgba(244,211,94,.15);
            border-color: rgba(244,211,94,.35);
            color: var(--gold);
        }

        .car-btn:disabled { opacity: .25; cursor: not-allowed; }

        .car-viewport {
            display: flex; gap: 16px;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            padding: 0 40px 4px;
            scrollbar-width: none;
        }

        .car-viewport::-webkit-scrollbar { display: none; }

        .car-viewport.single .car-slide {
            width: min(560px, 80vw);
            aspect-ratio: unset; max-height: 380px;
        }

        .car-viewport.single .car-slide img {
            object-fit: contain; background: rgba(0,0,0,.3);
        }

        .car-slide {
            scroll-snap-align: start;
            flex-shrink: 0;
            width: clamp(200px, 26vw, 320px);
            aspect-ratio: 4/3;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
            background: rgba(255,255,255,.04);
            cursor: zoom-in;
            transition: border-color .2s, transform .2s;
        }

        .car-slide:hover { border-color: rgba(244,211,94,.3); transform: translateY(-2px); }

        .car-slide img { width: 100%; height: 100%; object-fit: cover; display: block; }

        .car-placeholder {
            width: 100%; height: 100%;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 8px; color: rgba(255,255,255,.18);
            font-size: 12px; min-height: 160px;
        }

        .car-placeholder svg { width: 28px; height: 28px; }

        .car-dots {
            display: flex; justify-content: center;
            gap: 6px; padding-top: 14px;
        }

        .car-dot {
            width: 6px; height: 6px;
            border-radius: 50%; border: none;
            background: rgba(255,255,255,.22);
            cursor: pointer; padding: 0;
            transition: background .2s, transform .2s;
        }

        .car-dot[aria-current="true"] { background: var(--gold); transform: scale(1.35); }

        /* Lightbox */
        #d-lightbox {
            display: none;
            position: fixed; inset: 0;
            z-index: 500;
            background: rgba(0,0,0,.92);
            align-items: center; justify-content: center;
            cursor: zoom-out;
        }

        #d-lightbox.open { display: flex; }

        #d-lightbox img {
            max-width: 92vw; max-height: 90vh;
            border-radius: 10px; object-fit: contain;
            cursor: default;
            box-shadow: 0 24px 80px rgba(0,0,0,.6);
        }

        .lb-close {
            position: absolute; top: 20px; right: 24px;
            width: 38px; height: 38px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,.2);
            background: rgba(255,255,255,.08);
            color: #fff; font-size: 20px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: background .2s;
        }

        .lb-close:hover { background: rgba(255,255,255,.18); }

        .lb-arrow {
            position: absolute; top: 50%; transform: translateY(-50%);
            width: 44px; height: 44px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,.2);
            background: rgba(255,255,255,.08);
            color: #fff; font-size: 22px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: background .2s;
        }

        .lb-arrow:hover { background: rgba(244,211,94,.2); }
        .lb-arrow.prev { left: 20px; }
        .lb-arrow.next { right: 20px; }

        /* ── Slide nav row ── */
        .detail-nav-row {
            display: flex; gap: 12px;
            padding: 20px 40px 32px;
            border-top: 1px solid var(--border);
            max-width: 960px; margin: 0 auto; width: 100%;
        }

        .d-nav-btn {
            flex: 1;
            display: flex; align-items: center; justify-content: center;
            gap: 8px; padding: 12px 20px;
            border: 1px solid var(--border);
            background: rgba(255,255,255,.05);
            border-radius: 10px;
            font-size: 13px; font-weight: 600;
            color: var(--muted); cursor: pointer;
            transition: background .2s, color .2s, border-color .2s;
        }

        .d-nav-btn:hover:not(:disabled) {
            background: rgba(244,211,94,.12);
            border-color: rgba(244,211,94,.3);
            color: var(--gold);
        }

        .d-nav-btn:disabled { opacity: .25; cursor: not-allowed; }
        .d-nav-btn svg { width: 15px; height: 15px; }

        /* ══ PROGRESS BAR ═════════════════════════════ */
        #progress-bar {
            position: fixed; bottom: 0; left: 0; right: 0;
            height: 3px; z-index: 50;
            background: rgba(255,255,255,.07);
        }

        #progress-fill {
            height: 100%;
            background: linear-gradient(to right, rgba(244,211,94,.5), var(--gold));
            transition: width .5s cubic-bezier(.22,1,.36,1);
            box-shadow: 0 0 8px rgba(244,211,94,.4);
        }

        @media (max-width: 900px) {
            #orbit-nav { inset: -12%; }
            .orbit-planet { width: 48px; height: 48px; margin-left: -24px; margin-top: -24px; font-size: 8px; }
            #title-banner { padding: 14px 20px 18px; }
            .detail-content { grid-template-columns: 1fr; padding: 24px 20px 20px; }
            .detail-text { padding-right: 0; margin-bottom: 20px; }
            .detail-chips { border-left: none; border-top: 1px solid var(--border); padding-left: 0; padding-top: 20px; }
            .car-viewport { padding: 0 20px; }
            .gallery-header, .detail-nav-row { padding-left: 20px; padding-right: 20px; }
            .detail-close-bar { padding: 14px 20px; }
        }
    </style>
</head>

<body>
<div id="galaxy"></div>

<div id="globe-scene">
    <div id="globe-wrap">
        <div id="globe-atm"></div>
        <div id="globe-clip">
            <canvas id="globe-canvas" width="800" height="800"></canvas>
            <div class="globe-sheen"></div>
        </div>
    </div>

    <div id="globe-logo">
        <img src="assets/img/projects/oru/Oral-Roberts-University-Logo-Tan-udpated.webp" alt="Oral Roberts University">
    </div>

    <div id="orbit-nav">
        <div id="orbit-ring"><div id="orbit-belt"></div></div>

        <button class="orbit-arrow" id="orbit-prev" onclick="navigate(-1)" aria-label="Previous slide">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 12H5"/><path d="m12 5-7 7 7 7"/>
            </svg>
        </button>

        <div id="orbit-planets"></div>

        <button class="orbit-arrow" id="orbit-next" onclick="navigate(1)" aria-label="Next slide">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>
            </svg>
        </button>
    </div>
</div>

<div id="title-banner">
    <div class="banner-left">
        <div class="banner-title">International Student Onboarding:</div>
        <div class="banner-subtitle">Structure, Care, and Purpose</div>
    </div>
    <div class="banner-byline">
        <span class="banner-by">By:</span>
        <span class="banner-name">Gilson Lacerda</span>
    </div>
</div>

<div id="progress-bar"><div id="progress-fill"></div></div>

<div id="detail-overlay">
    <div class="detail-close-bar">
        <span></span>
        <div class="detail-slide-menu" id="detail-slide-menu"></div>
        <button class="detail-close-btn" id="detail-close-btn">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
            </svg>
        </button>
    </div>

    <div class="detail-scroll">

        <div class="detail-content">
            <div class="detail-text">
                <h2 class="d-title" id="d-title"></h2>
                <div class="d-subtitle" id="d-subtitle"></div>
                <p class="d-body" id="d-body"></p>
                <blockquote class="d-quote" id="d-quote" style="display:none"></blockquote>
            </div>
            <div class="detail-chips">
                <div class="chips-label">Key Points</div>
                <div id="d-points"></div>
            </div>
        </div>

        <div class="detail-gallery" id="detail-gallery">
            <div class="gallery-header">
                <span class="gallery-label">Photos</span>
                <div class="gallery-controls">
                    <button class="car-btn" id="car-prev" aria-label="Previous">&#8249;</button>
                    <button class="car-btn" id="car-next" aria-label="Next">&#8250;</button>
                </div>
            </div>
            <div class="car-viewport" id="car-viewport" tabindex="0" aria-live="polite"></div>
            <div class="car-dots" id="car-dots" role="tablist" aria-label="Gallery slides"></div>
        </div>

        <div class="detail-nav-row">
            <button class="d-nav-btn" id="d-prev">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5"/><path d="m12 5-7 7 7 7"/>
                </svg>
                Previous
            </button>
            <button class="d-nav-btn" id="d-next">
                Next
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>
                </svg>
            </button>
        </div>

    </div>
</div>

<div id="d-lightbox">
    <button class="lb-close" id="lb-close">&#x2715;</button>
    <button class="lb-arrow prev" id="lb-prev">&#8249;</button>
    <img id="lb-img" src="" alt="Lightbox image">
    <button class="lb-arrow next" id="lb-next">&#8250;</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
    const SLIDES = [
        {
            id: 'gilson', label: 'About',
            title: "I'm Gilson Lacerda",
            subtitle: 'Systems thinker with global perspective',
            body: "I'm from Brazil and hold degrees in theology and professional leadership. I have raised leaders around the world as an Alumni Director. My journey to continually improve systems led me to become a software engineer. I speak Portuguese, Spanish, and English.",
            points: ['Alumni Director | Global leadership', 'Multilingual | Global perspective', 'Software Engineer | Systems thinker'],
            images: ['assets/img/projects/oru/family.jpg', 'assets/img/projects/oru/students.png', 'assets/img/projects/oru/professor.png', 'assets/img/projects/oru/KCBC.png'],
            globeX: -0.05,
        },
        {
            id: 'oru', label: 'Why ORU',
            title: 'Why ORU?',
            subtitle: 'Mission, excellence & global impact',
            body: "I grew up in Brazil reading about Oral Roberts, and I've built my life on faith and the whole-person principle. When I finally had the opportunity to walk the campus, I felt the spirit of excellence, and I knew: this is my place. I have a deep conviction that God wants me to join what He is doing at ORU.",
            points: ['Spirit of excellence', 'Whole-person development', "God's calling"],
            images: ['assets/img/projects/oru/book.png', 'assets/img/projects/oru/Jesus.jpeg', 'assets/img/projects/oru/oruhands.jpg'],
            globeX: -0.02,
        },
        {
            id: 'isr', label: 'Why ISR',
            title: 'Why International Student Relations',
            subtitle: 'Passion, structure & care',
            body: "Since I was a kid, God placed the nations on my heart. Coming to the United States, I navigated every visa process myself, no lawyer, no shortcuts, giving me a unique understanding of what international students face. ISR is where my calling, my story, and my skills come together. I was made for this work.",
            points: ['Communication across cultures', 'Structured processes', 'Care for transition'],
            images: ['assets/img/projects/oru/process.jpg', 'assets/img/projects/oru/process2.jpg'],
            globeX: 0.01,
        },
        {
            id: 'bring', label: 'Skills',
            title: 'What I Bring',
            subtitle: 'Scalable thinking & lived experience',
            body: "As a foreign national who has navigated the student immigration process firsthand, I understand both the technical and emotional aspects of being an international student. My perspective is further informed by my global leadership experience as Alumni Director of the largest Rhema alumni network in the world, my theology foundation, and my technology skills.",
            points: ['International perspective', 'Leadership experience', 'Technical fluency'],
            images: ['assets/img/projects/oru/system.png', 'assets/img/projects/oru/products.png', 'assets/img/projects/oru/events.png'],
            globeX: 0.04,
        },
        {
            id: 'ai', label: 'Vision',
            title: 'Scaling with AI',
            subtitle: 'Using smart systems to increase human care',
            body: "I want to build intelligent systems that proactively identify at-risk students, automate routine tasks, and provide advisors real-time visibility into every student's journey. The technology is available, and I can develop it to serve ISR.",
            points: ['Intelligent support tools', 'Process optimization', 'Data visibility', 'More human-centered time', 'Proactive student care'],
            images: ['assets/img/projects/oru/irs.png'],
            globeX: 0.07,
        },
        {
            id: 'fit', label: 'Role Fit',
            title: "I'm the Right Person for the Position",
            subtitle: 'Skill, conviction & service',
            body: "I will serve ISR, ORU, and its students with my comprehensive skills, transnational mindset, and spiritual integrity.",
            points: ['Technical capability', 'Global perspective', 'Spiritual integrity', 'Servant leadership'],
            images: ['assets/img/projects/oru/gil.jpg'],
            globeX: 0.10,
        },
    ];

    let globeMesh, cloudMesh, targetTiltX = 0;
    let activeIndex = 0;
    let timer = null;

    function initGlobe() {
        const canvas = document.getElementById('globe-canvas');
        const sz = canvas.offsetWidth || 600;

        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(sz, sz);
        renderer.setClearColor(0x000000, 0);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
        camera.position.z = 2.55;

        scene.add(new THREE.AmbientLight(0x0d1830, 0.42));

        const sun = new THREE.DirectionalLight(0xfff6e8, 1.45);
        sun.position.set(3, 4, 3);
        scene.add(sun);

        const fill = new THREE.DirectionalLight(0x1a3a6a, 0.16);
        fill.position.set(-4, -1, -3);
        scene.add(fill);

        const loader = new THREE.TextureLoader();
        const earthTex  = loader.load('https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg');
        const normalTex = loader.load('https://threejs.org/examples/textures/planets/earth_normal_2048.jpg');
        const specTex   = loader.load('https://threejs.org/examples/textures/planets/earth_specular_2048.jpg');
        const cloudTex  = loader.load('https://threejs.org/examples/textures/planets/earth_clouds_1024.png');

        globeMesh = new THREE.Mesh(
            new THREE.SphereGeometry(1, 80, 80),
            new THREE.MeshPhongMaterial({
                map: earthTex, normalMap: normalTex, specularMap: specTex,
                specular: new THREE.Color(0x3b78b1), shininess: 28
            })
        );
        globeMesh.rotation.y = -1;
        scene.add(globeMesh);

        scene.add(new THREE.Mesh(
            new THREE.SphereGeometry(1.06, 64, 64),
            new THREE.MeshPhongMaterial({
                color: 0x1a4a99, emissive: new THREE.Color(0x0a2060),
                transparent: true, opacity: 0.15, side: THREE.BackSide, depthWrite: false
            })
        ));

        scene.add(new THREE.Mesh(
            new THREE.SphereGeometry(1.15, 64, 64),
            new THREE.MeshPhongMaterial({
                color: 0x0d2a66, emissive: new THREE.Color(0x061540),
                transparent: true, opacity: 0.07, side: THREE.BackSide, depthWrite: false
            })
        ));

        cloudMesh = new THREE.Mesh(
            new THREE.SphereGeometry(1.015, 64, 64),
            new THREE.MeshPhongMaterial({ map: cloudTex, transparent: true, opacity: 0.35, depthWrite: false })
        );
        cloudMesh.rotation.y = -0.88;
        scene.add(cloudMesh);

        let isDragging = false, prevMouseX = 0, prevMouseY = 0;
        let velocityX = 0, velocityY = 0;
        let autoRotY = globeMesh.rotation.y;

        const globeWrap = document.getElementById('globe-wrap');
        globeWrap.style.cursor = 'grab';

        globeWrap.addEventListener('mousedown', e => {
            isDragging = true; prevMouseX = e.clientX; prevMouseY = e.clientY;
            velocityX = 0; velocityY = 0;
            globeWrap.style.cursor = 'grabbing'; e.preventDefault();
        });

        window.addEventListener('mousemove', e => {
            if (!isDragging) return;
            const dx = e.clientX - prevMouseX, dy = e.clientY - prevMouseY;
            velocityX = dx * 0.008; velocityY = dy * 0.008;
            globeMesh.rotation.y += velocityX;
            globeMesh.rotation.x = Math.max(-1.2, Math.min(1.2, globeMesh.rotation.x + velocityY));
            cloudMesh.rotation.y = globeMesh.rotation.y;
            cloudMesh.rotation.x = globeMesh.rotation.x;
            prevMouseX = e.clientX; prevMouseY = e.clientY;
        });

        window.addEventListener('mouseup', () => {
            if (!isDragging) return;
            isDragging = false; globeWrap.style.cursor = 'grab';
            autoRotY = globeMesh.rotation.y;
        });

        globeWrap.addEventListener('touchstart', e => {
            isDragging = true;
            prevMouseX = e.touches[0].clientX; prevMouseY = e.touches[0].clientY;
            velocityX = 0; velocityY = 0; e.preventDefault();
        }, { passive: false });

        window.addEventListener('touchmove', e => {
            if (!isDragging) return;
            const dx = e.touches[0].clientX - prevMouseX, dy = e.touches[0].clientY - prevMouseY;
            velocityX = dx * 0.008; velocityY = dy * 0.008;
            globeMesh.rotation.y += velocityX;
            globeMesh.rotation.x = Math.max(-1.2, Math.min(1.2, globeMesh.rotation.x + velocityY));
            cloudMesh.rotation.y = globeMesh.rotation.y;
            cloudMesh.rotation.x = globeMesh.rotation.x;
            prevMouseX = e.touches[0].clientX; prevMouseY = e.touches[0].clientY;
        }, { passive: false });

        window.addEventListener('touchend', () => { isDragging = false; autoRotY = globeMesh.rotation.y; });

        (function tick() {
            requestAnimationFrame(tick);
            if (!isDragging) {
                if (Math.abs(velocityX) > 0.0001 || Math.abs(velocityY) > 0.0001) {
                    globeMesh.rotation.y += velocityX;
                    globeMesh.rotation.x = Math.max(-1.2, Math.min(1.2, globeMesh.rotation.x + velocityY));
                    velocityX *= 0.92; velocityY *= 0.92;
                    autoRotY = globeMesh.rotation.y;
                } else {
                    velocityX = 0; velocityY = 0;
                    autoRotY += 0.0007;
                    globeMesh.rotation.y += (autoRotY - globeMesh.rotation.y) * 0.04;
                    globeMesh.rotation.x += (targetTiltX - globeMesh.rotation.x) * 0.045;
                }
                cloudMesh.rotation.y = globeMesh.rotation.y;
                cloudMesh.rotation.x = globeMesh.rotation.x;
            }
            renderer.render(scene, camera);
        })();

        new ResizeObserver(() => {
            const s = canvas.offsetWidth;
            renderer.setSize(s, s);
        }).observe(canvas);
    }

    let orbitAngle = Math.PI / 2;

    function buildOrbitNav() {
        const wrap = document.getElementById('orbit-planets');
        wrap.innerHTML = '';
        SLIDES.forEach((s, i) => {
            const btn = document.createElement('button');
            btn.className = 'orbit-planet';
            btn.dataset.idx = i;
            btn.innerHTML = `<span>${s.label}</span>`;
            btn.onclick = (e) => {
                e.stopPropagation();
                activeIndex = i;
                updateOrbitPlanets();
                openDetail(i);
                resetTimer();
            };
            wrap.appendChild(btn);
        });
        updateOrbitPlanets();
    }

    function updateOrbitPlanets() {
        const planets = [...document.querySelectorAll('.orbit-planet')];
        const a = 42, b = 15;
        const spread = (Math.PI * 2) / planets.length;

        planets.forEach((planet, i) => {
            const angle = orbitAngle + i * spread;
            const x = 50 + Math.cos(angle) * a;
            const y = 50 + Math.sin(angle) * b;
            const depth = Math.sin(angle);
            const isFront = depth > 0;
            const scale = isFront ? 0.96 + depth * 0.16 : 0.78 + (depth + 1) * 0.06;

            planet.style.left      = `${x}%`;
            planet.style.top       = `${y}%`;
            planet.style.transform = `scale(${scale})`;
            planet.style.opacity   = isFront ? 1 : 0.16;
            planet.style.zIndex    = isFront ? '35' : '5';

            planet.classList.toggle('front', isFront);
            planet.classList.toggle('back', !isFront);
            planet.classList.toggle('active', i === activeIndex);
        });

        document.getElementById('orbit-prev').disabled = activeIndex === 0;
        document.getElementById('orbit-next').disabled = activeIndex === SLIDES.length - 1;

        const pct = SLIDES.length <= 1 ? 100 : (activeIndex / (SLIDES.length - 1)) * 100;
        document.getElementById('progress-fill').style.width = pct + '%';
    }

    function animateOrbit() {
        orbitAngle -= 0.0022;
        updateOrbitPlanets();
        requestAnimationFrame(animateOrbit);
    }

    // ── Slide menu ──────────────────────────────────
    function buildSlideMenu() {
        const menu = document.getElementById('detail-slide-menu');
        menu.innerHTML = '';
        SLIDES.forEach((s, i) => {
            const btn = document.createElement('button');
            btn.className = 'slide-menu-btn';
            btn.textContent = s.label;
            btn.onclick = () => {
                activeIndex = i;
                updateOrbitPlanets();
                renderDetail();  // ← just re-render content, don't call openDetail() which resets index
            };
            menu.appendChild(btn);
        });
    }

    function updateSlideMenu() {
        [...document.querySelectorAll('.slide-menu-btn')].forEach((btn, i) => {
            btn.classList.toggle('active', i === activeIndex);
        });
    }

    // ── Key points — plain list ──────────────────────
    function buildPoints(points) {
        const pts = document.getElementById('d-points');
        if (!points || points.length === 0) { pts.innerHTML = ''; return; }
        pts.innerHTML = points.map(p => `
            <div class="d-point">
                <div class="d-point-dot"></div>
                <span>${typeof p === 'string' ? p : p.label}</span>
            </div>`).join('');
    }

    // ── Lightbox ─────────────────────────────────────
    let lbImages = [], lbIdx = 0;

    function openLightbox(images, idx) {
        lbImages = images; lbIdx = idx;
        document.getElementById('lb-img').src = lbImages[lbIdx];
        document.getElementById('d-lightbox').classList.add('open');
        document.getElementById('lb-prev').style.opacity = lbIdx === 0 ? '.3' : '1';
        document.getElementById('lb-next').style.opacity = lbIdx === lbImages.length - 1 ? '.3' : '1';
    }

    function closeLightbox() {
        document.getElementById('d-lightbox').classList.remove('open');
        document.getElementById('lb-img').src = '';
    }

    function lbGo(dir) {
        const next = lbIdx + dir;
        if (next < 0 || next >= lbImages.length) return;
        lbIdx = next;
        document.getElementById('lb-img').src = lbImages[lbIdx];
        document.getElementById('lb-prev').style.opacity = lbIdx === 0 ? '.3' : '1';
        document.getElementById('lb-next').style.opacity = lbIdx === lbImages.length - 1 ? '.3' : '1';
    }

    document.getElementById('lb-close').onclick = closeLightbox;
    document.getElementById('lb-prev').onclick  = () => lbGo(-1);
    document.getElementById('lb-next').onclick  = () => lbGo(1);
    document.getElementById('d-lightbox').addEventListener('click', e => {
        if (e.target === document.getElementById('d-lightbox')) closeLightbox();
    });

    // ── Filmstrip carousel ───────────────────────────
    let carActiveIdx = 0;

    function buildCarousel(images) {
        const viewport = document.getElementById('car-viewport');
        const dotsWrap = document.getElementById('car-dots');
        viewport.innerHTML = ''; dotsWrap.innerHTML = '';
        carActiveIdx = 0;

        viewport.classList.toggle('single', images && images.length === 1);

        if (!images || images.length === 0) {
            viewport.innerHTML = `<div class="car-slide"><div class="car-placeholder">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect width="18" height="18" x="3" y="3" rx="2"/>
                    <circle cx="9" cy="9" r="2"/>
                    <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>
                </svg>Add images to this slide
            </div></div>`;
            document.getElementById('car-prev').disabled = true;
            document.getElementById('car-next').disabled = true;
            return;
        }

        images.forEach((src, i) => {
            const slide = document.createElement('div');
            slide.className = 'car-slide';
            slide.style.cursor = 'zoom-in';
            const img = document.createElement('img');
            img.src = src; img.alt = `Photo ${i + 1}`; img.loading = 'lazy';
            img.onerror = () => {
                slide.innerHTML = `<div class="car-placeholder">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <rect width="18" height="18" x="3" y="3" rx="2"/>
                    </svg>
                </div>`;
            };
            slide.appendChild(img);
            slide.addEventListener('click', () => openLightbox(images, i));
            viewport.appendChild(slide);

            const dot = document.createElement('button');
            dot.className = 'car-dot'; dot.type = 'button';
            dot.setAttribute('role', 'tab');
            dot.setAttribute('aria-label', `Go to photo ${i + 1}`);
            dot.setAttribute('aria-current', i === 0 ? 'true' : 'false');
            dot.addEventListener('click', () => carGoTo(i));
            dotsWrap.appendChild(dot);
        });

        updateCarUI();

        let scrollTick = false;
        viewport.addEventListener('scroll', () => {
            if (scrollTick) return;
            scrollTick = true;
            requestAnimationFrame(() => {
                const slideW = viewport.querySelector('.car-slide')?.offsetWidth || 1;
                const idx = Math.round(viewport.scrollLeft / (slideW + 16));
                if (idx !== carActiveIdx) { carActiveIdx = idx; updateCarUI(); }
                scrollTick = false;
            });
        });
    }

    function updateCarUI() {
        const dots = [...document.querySelectorAll('.car-dot')];
        dots.forEach((d, i) => d.setAttribute('aria-current', i === carActiveIdx ? 'true' : 'false'));
        document.getElementById('car-prev').disabled = carActiveIdx === 0;
        document.getElementById('car-next').disabled = carActiveIdx >= dots.length - 1;
    }

    function carGoTo(i) {
        const viewport = document.getElementById('car-viewport');
        const slides = [...viewport.querySelectorAll('.car-slide')];
        carActiveIdx = Math.max(0, Math.min(i, slides.length - 1));
        viewport.scrollTo({ left: carActiveIdx * ((slides[0]?.offsetWidth || 0) + 16), behavior: 'smooth' });
        updateCarUI();
    }

    document.getElementById('car-prev').addEventListener('click', () => carGoTo(carActiveIdx - 1));
    document.getElementById('car-next').addEventListener('click', () => carGoTo(carActiveIdx + 1));
    document.getElementById('d-prev').addEventListener('click', () => detailNavigate(-1));
    document.getElementById('d-next').addEventListener('click', () => detailNavigate(1));
    document.getElementById('detail-close-btn').addEventListener('click', closeDetail);

    // ── renderDetail: fill content for current activeIndex ──
    // Separated from openDetail so the slide menu can switch
    // slides without re-triggering the open animation or resetting state.
    function renderDetail() {
        const s = SLIDES[activeIndex];

        document.getElementById('d-title').textContent = s.title;
        document.getElementById('d-subtitle').textContent = s.subtitle;
        document.getElementById('d-body').textContent = s.body;
        targetTiltX = s.globeX;

        const q = document.getElementById('d-quote');
        if (s.quote) { q.style.display = 'block'; q.textContent = `"${s.quote}"`; }
        else { q.style.display = 'none'; }

        buildPoints(s.points || []);
        buildCarousel(s.images || []);
        updateSlideMenu();

        // Fix nav buttons: use the CURRENT activeIndex at time of click
        document.getElementById('d-prev').disabled = activeIndex === 0;
        document.getElementById('d-next').disabled = activeIndex === SLIDES.length - 1;

        document.querySelector('.detail-scroll').scrollTop = 0;
    }

    // ── openDetail: open overlay then render ────────
    function openDetail(idx) {
        if (idx !== undefined) activeIndex = idx;
        document.getElementById('detail-overlay').classList.add('open');
        document.body.style.overflow = 'hidden';
        renderDetail();
    }

    function closeDetail() {
        document.getElementById('detail-overlay').classList.remove('open');
        document.body.style.overflow = '';
    }

    // Fix: capture activeIndex at call time, not inside a closure that reads stale state
    function detailNavigate(dir) {
        const target = activeIndex + dir;
        if (target < 0 || target >= SLIDES.length) return;
        activeIndex = target;
        updateOrbitPlanets();
        renderDetail();
    }

    function navigate(dir) {
        const next = Math.max(0, Math.min(SLIDES.length - 1, activeIndex + dir));
        if (next !== activeIndex) { activeIndex = next; updateOrbitPlanets(); resetTimer(); }
    }

    function resetTimer() {
        clearInterval(timer);
        timer = setInterval(() => {
            activeIndex = (activeIndex + 1) % SLIDES.length;
            updateOrbitPlanets();
        }, 7000);
    }

    document.addEventListener('keydown', e => {
        const lbOpen     = document.getElementById('d-lightbox').classList.contains('open');
        const detailOpen = document.getElementById('detail-overlay').classList.contains('open');

        if (lbOpen) {
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowLeft')  lbGo(-1);
            if (e.key === 'ArrowRight') lbGo(1);
            return;
        }
        if (e.key === 'Escape') { if (detailOpen) closeDetail(); return; }
        if (detailOpen) {
            if (e.key === 'ArrowLeft')  detailNavigate(-1);
            if (e.key === 'ArrowRight') detailNavigate(1);
            return;
        }
        if (e.key === 'ArrowRight' || e.key === 'ArrowDown') navigate(1);
        if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   navigate(-1);
        if (e.key === 'Enter' || e.key === ' ') openDetail();
    });

    window.addEventListener('DOMContentLoaded', () => {
        buildOrbitNav();
        buildSlideMenu();
        initGlobe();
        animateOrbit();
        resetTimer();
    });
</script>
